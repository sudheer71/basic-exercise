name: deployment2-exercise
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 
        uses: actions/checkout@v3
      - name: install dependencies
        run: npm ci
      - name: run lint
        run: npm run lint
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: install dependencies 
        run: npm ci
      - name: code tests
        run: npm test
  deploy:
    #needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: install dependencies 
        run: npm ci
      - name: build
        run: npm run build
      - name: deploy
        run: echo "Deploying the application..." 

